<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DPAM Secure Cipher</title>

<style>
body {
    font-family: 'Segoe UI', Arial;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
    padding: 0;
}

.container {
    background: white;
    max-width: 650px;
    margin: 40px auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

h2 {
    text-align: center;
    color: #1e3c72;
}

textarea {
    width: 100%;
    height: 90px;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    background: #2a5298;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.output {
    background: #f1f3f6;
    padding: 10px;
    margin-top: 10px;
    white-space: pre-wrap;
    font-family: monospace;
}
</style>
</head>

<body>

<div class="container">

<h2>🔐 DPAM Secure Encryption</h2>

<textarea id="msg" placeholder="Enter message..."></textarea>
<button onclick="encrypt()">Encrypt</button>
<div class="output" id="enc"></div>

<h2>🔓 DPAM Secure Decryption</h2>

<textarea id="cipher" placeholder="Paste cipher..."></textarea>
<button onclick="decrypt()">Decrypt</button>
<div class="output" id="dec"></div>

</div>

<script>

const MOD = 256;

const K = [[1,1],[1,2]];
const K_inv = [[2,255],[255,1]];

function mod(n){
    return ((n % MOD) + MOD) % MOD;
}

function multiply(A,B){
return [
[
mod(A[0][0]*B[0][0] + A[0][1]*B[1][0]),
mod(A[0][0]*B[0][1] + A[0][1]*B[1][1])
],
[
mod(A[1][0]*B[0][0] + A[1][1]*B[1][0]),
mod(A[1][0]*B[0][1] + A[1][1]*B[1][1])
]
];
}

function getA(n){

if(n===4) return [[1,2],[254,1]];

let f = new Array(n);

if(n%2===0){
let m=n/2;
for(let i=0;i<n;i++){
if(i<m-1) f[i]=-(i+1);
else if(i===m-1) f[i]=m;
else if(i===m) f[i]=-m;
else f[i]=2*m-i;
}
}else{
let m=(n-1)/2;
f[0]=0;
for(let i=1;i<=m;i++) f[i]=i;
for(let i=1;i<=m;i++) f[m+i]=i-(2*m+1);
}

function w(i){
return f[(i-1+n)%n] + f[(i+1)%n];
}

return [
[mod(w(0)),mod(w(1))],
[mod(w(2)),mod(w(3))]
];
}


// 🔐 ENCRYPT
function encrypt(){

let msg = document.getElementById("msg").value;
let n = msg.length;

// length block
let len1 = Math.floor(n/256);
let len2 = n % 256;

let P_len = [[len1,len2],[0,0]];
let C_len = multiply(P_len, K);

let r1=[C_len[0][0],C_len[0][1]];
let r2=[C_len[1][0],C_len[1][1]];

// padding
while(msg.length % 4 !== 0) msg += "_";

let A = getA(n);

for(let i=0;i<msg.length;i+=4){

let nums = msg.slice(i,i+4).split('').map(c=>c.charCodeAt(0));

let P=[[nums[0],nums[1]],[nums[2],nums[3]]];

let PA=[
[mod(P[0][0]+A[0][0]),mod(P[0][1]+A[0][1])],
[mod(P[1][0]+A[1][0]),mod(P[1][1]+A[1][1])]
];

let C = multiply(PA, K);

r1.push(C[0][0],C[0][1]);
r2.push(C[1][0],C[1][1]);
}

document.getElementById("enc").innerText =
r1.join(" ")+"\n"+r2.join(" ");
}


// 🔓 DECRYPT
function decrypt(){

let text = document.getElementById("cipher").value.trim().split("\n");

let r1 = text[0].split(" ").map(Number);
let r2 = text[1].split(" ").map(Number);

// get n
let firstBlock=[[r1[0],r1[1]],[r2[0],r2[1]]];
let P_len = multiply(firstBlock, K_inv);

let n = mod(P_len[0][0])*256 + mod(P_len[0][1]);

let A = getA(n);

let msg="";

for(let i=2;i<r1.length;i+=2){

let block=[[r1[i],r1[i+1]],[r2[i],r2[i+1]]];

let PA=multiply(block,K_inv);

let P=[
[mod(PA[0][0]-A[0][0]),mod(PA[0][1]-A[0][1])],
[mod(PA[1][0]-A[1][0]),mod(PA[1][1]-A[1][1])]
];

msg += String.fromCharCode(P[0][0],P[0][1],P[1][0],P[1][1]);
}

msg = msg.substring(0,n);

document.getElementById("dec").innerText = msg;
}

</script>

</body>
</html>
